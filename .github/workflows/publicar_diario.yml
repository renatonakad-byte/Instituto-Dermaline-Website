name: Publicacao Diaria Dermaline

on:
  schedule:
    # Roda todos os dias às 08:00 da manhã no Horário de Brasília (11:00 UTC)
    - cron: '0 11 * * *'
  # Permite disparar manualmente pelo painel do GitHub a qualquer hora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Gerar Card Visual do Dia
        run: |
          python scripts/publicar_redes.py --apenas-card

      - name: 2. Salvar e Publicar Card no Repositório (Disponibilizar URL)
        run: |
          git config --global user.name "Dermaline Bot"
          git config --global user.email "bot@institutodermaline.com.br"
          git add assets/images/cards/
          git diff --staged --quiet || (git commit -m "Auto: Card diário atualizado [skip ci]" && git push)

      - name: 3. Disparar Publicação nas Redes Sociais
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || '457804507635117' }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || '17841404225729043' }}
        run: |
          python scripts/publicar_redes.py --apenas-publicar
