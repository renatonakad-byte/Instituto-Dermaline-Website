name: Publicacao Diaria Dermaline (3 Posts por Dia)

on:
  schedule:
    # Post 1: 08:00 da manhã no Horário de Brasília (11:00 UTC) -> Nutrição & Longevidade (Dr. Renato)
    - cron: '0 11 * * *'
    # Post 2: 13:00 da tarde no Horário de Brasília (16:00 UTC) -> Dermatologia Clínica (Dra. Line)
    - cron: '0 16 * * *'
    # Post 3: 19:00 da noite no Horário de Brasília (22:00 UTC) -> Beleza & Estética (Dra. Line)
    - cron: '0 22 * * *'
  # Permite disparar manualmente pelo painel do GitHub escolhendo qual post publicar (ou os 3 de uma vez)
  workflow_dispatch:
    inputs:
      pilar:
        description: 'Qual post publicar? (todos, nutricao, dermatologia, beleza)'
        required: false
        default: 'todos'
        type: choice
        options:
          - todos
          - nutricao
          - dermatologia
          - beleza

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Determinar Pilar pelo Horário ou Input Manual
        id: definir_pilar
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PILAR="${{ github.event.inputs.pilar || 'todos' }}"
          else
            HORA_UTC=$(date -u +%H)
            if [ "$HORA_UTC" -lt 14 ]; then
              PILAR="nutricao"
            elif [ "$HORA_UTC" -lt 19 ]; then
              PILAR="dermatologia"
            else
              PILAR="beleza"
            fi
          fi
          echo "Pilar selecionado: $PILAR"
          echo "pilar=$PILAR" >> $GITHUB_OUTPUT

      - name: 2. Gerar Cards Visuais em Alta Definição (1080x1080)
        run: |
          node scripts/renderizar_cards_local.js --pilar ${{ steps.definir_pilar.outputs.pilar }} || python scripts/publicar_redes.py --apenas-card --pilar ${{ steps.definir_pilar.outputs.pilar }}

      - name: 3. Salvar e Publicar Cards no Repositório (Disponibilizar URLs Públicas)
        run: |
          git config --global user.name "Dermaline Bot"
          git config --global user.email "bot@institutodermaline.com.br"
          git add assets/images/cards/
          git diff --staged --quiet || (git commit -m "Auto: Cards diários atualizados (${{ steps.definir_pilar.outputs.pilar }}) [skip ci]" && git push)

      - name: 4. Disparar Publicação nas Redes Sociais (Instagram & Facebook)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || '457804507635117' }}
          INSTAGRAM_ACCOUNT_ID: '17841400910495764'
        run: |
          python scripts/publicar_redes.py --apenas-publicar --pilar ${{ steps.definir_pilar.outputs.pilar }}
